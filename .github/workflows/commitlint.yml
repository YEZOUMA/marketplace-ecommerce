name: Commitlint

on:
  pull_request:
    branches: [main, develop]

jobs:
  commitlint:
    name: Vérification Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Lint commits on this PR
        run: npx commitlint --from "origin/${{ github.event.pull_request.base.ref }}" --to HEAD --verbose
