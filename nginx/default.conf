# Single entry point for the whole stack: routes browser traffic to the
# frontend SPA, API calls to the backend, and (when MinIO is used for image
# storage) public object reads to MinIO — so the browser only ever talks to
# one origin.

client_max_body_size 20M;

upstream frontend_upstream {
    server frontend:80;
}

upstream backend_upstream {
    server backend:4000;
}

upstream storage_upstream {
    server storage:9000;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend_upstream/uploads/;
        proxy_set_header Host $host;
    }

    # Only reachable when STORAGE_MODE=minio (product images served straight from MinIO).
    location /product-images/ {
        proxy_pass http://storage_upstream/product-images/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend_upstream/health;
    }

    location / {
        proxy_pass http://frontend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
